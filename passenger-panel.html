<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Pasajero | Pacific Coast Taxi</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="passenger-panel.html" class="sidebar-logo">
          <div class="sidebar-logo-icon">👤</div>
          <span class="sidebar-logo-text">Pasajero</span>
        </a>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-title">Mi Cuenta</span>
          <a href="passenger-panel.html" class="nav-item active">
            <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
            </svg>
            <span class="nav-item-text">Mi Panel</span>
          </a>
          <a href="landing.html" class="nav-item">
            <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span class="nav-item-text">Sitio Público</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar" id="userAvatar">PA</div>
          <div class="user-info">
            <div class="user-name" id="userName">Pasajero</div>
            <div class="user-role" id="userRole">Usuario</div>
          </div>
          <button class="btn-icon btn-ghost" id="logoutBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="btn-icon btn-ghost mobile-menu-btn" id="menuBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div>
            <h1 class="header-title">Mi Panel de Pasajero</h1>
          </div>
        </div>
      </header>
      
      <div class="main-content-inner">
        <div class="empty-state">
          <h2>Bienvenido Pasajero</h2>
          <p>Panel en desarrollo. Aquí podrás reservar viajes, ver tu historial y calificar conductores.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/passenger-panel.js"></script>
</body>
</html>
