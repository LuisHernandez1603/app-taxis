<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pacific Coast Taxi</title>
  <meta name="description" content="Inicia sesión en tu cuenta de Pacific Coast Taxi">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #0a1628 0%, #111d32 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .login-container {
      background: #1a2d4a;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .login-header h1 {
      font-size: 1.75rem;
      color: #f8fafc;
      margin: 0 0 0.5rem 0;
      font-weight: 700;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #f8fafc;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #2a3f5f;
      border-radius: 6px;
      background: #111d32;
      color: #f8fafc;
      font-size: 0.875rem;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #102f63;
      box-shadow: 0 0 0 3px rgba(16, 47, 99, 0.3);
      background: #0f1e2e;
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
      border-left: 3px solid #ef4444;
    }

    .error-message.show {
      display: block;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: #102f63;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
    }

    .login-btn:hover {
      background: #0a1f47;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 47, 99, 0.2);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.875rem;
    }

    .divider::before {
      content: '';
      display: inline-block;
      width: 40%;
      height: 1px;
      background: #2a3f5f;
      margin-right: 0.5rem;
    }

    .divider::after {
      content: '';
      display: inline-block;
      width: 40%;
      height: 1px;
      background: #2a3f5f;
      margin-left: 0.5rem;
    }

    .demo-users {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .demo-btn {
      padding: 0.75rem;
      border: 1px solid #2a3f5f;
      background: #111d32;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .demo-btn:hover {
      background: #102f63;
      color: #f8fafc;
      border-color: #102f63;
      transform: translateY(-2px);
    }

    .demo-btn strong {
      font-weight: 600;
    }

    .demo-btn span {
      font-size: 0.65rem;
      opacity: 0.8;
      color: #94a3b8;
    }

    .landing-link {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #2a3f5f;
    }

    .landing-link a {
      color: #f59e0b;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .landing-link a:hover {
      color: #fbbf24;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .login-container {
        padding: 1.5rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">🚕</div>
      <h1>Pacific Coast</h1>
      <p>Sistema de Gestión de Taxis</p>
    </div>

    <form id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="usuario@pacificcoast.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Iniciar Sesión</button>
    </form>

    <div class="divider">Usuarios Demo</div>

    <div class="demo-users">
      <button class="demo-btn" type="button" data-email="admin@pacificcoast.com" data-password="admin123">
        <strong>Administrador</strong>
        <span>admin@pacificcoast.com</span>
      </button>
      <button class="demo-btn" type="button" data-email="user@pacificcoast.com" data-password="user123">
        <strong>Usuario</strong>
        <span>user@pacificcoast.com</span>
      </button>
    </div>

    <div class="landing-link">
      <a href="landing.html">← Volver a inicio</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Prevenir redireccion si ya esta autenticado
    window.addEventListener('load', () => {
      const user = AUTH.getCurrentUser();
      if (user) {
        window.location.href = 'admin-dashboard.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMessage');

      const result = AUTH.login(email, password);
      
      if (result.success) {
        window.location.href = 'admin-dashboard.html';
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.add('show');
        setTimeout(() => errorEl.classList.remove('show'), 5000);
      }
    });

    // Demo button handlers
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const email = this.dataset.email;
        const password = this.dataset.password;
        
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
        document.getElementById('loginForm').submit();
      });
    });
  </script>
</body>
</html>
